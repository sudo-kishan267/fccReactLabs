<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
     <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script&family=Satisfy&display=swap"
      rel="stylesheet"
    />
    <style>
      /* * {
        outline: 2px solid white;
      } */
      .font-cursive {
        font-family: "Pacifico", cursive;
      }
      
    </style>
  </head>
  <body class="bg-gray-800">
    <div
      id="main-container"
      class="flex flex-col  mt-14 justify-center items-center pb-10 "
    >
      <h2
        class="font-cursive text-center text-6xl font-bold text-orange-400 mb-6"
      >
        Photography Exibition
      </h2>
      <div class="main-container grid grid-cols-1 sm:grid-cols-3 gap-2 p-6 ">
        <div class="card bg-gray-900 rounded-2xl shadow-lg p-6 w-full ">
          <!-- Product Image -->
          <img
            src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg"
            alt="Colosseso.jpg"
            class="rounded-xl w-full h-52 object-cover text-white"
          />

          <!-- Product Info -->
          <div class="mt-4">
            <h2 class=" subheading text-xl font-semibold text-gray-200">
              Colosseum, Rome
            </h2>

            <p class=" description text-gray-300 text-sm mt-1">
              There is so much history and beauty. The light hits it just right.
            </p>           

            <!-- Quantity + Remove -->
            <div class="flex items-center gap-6  mt-5">
              <!-- Like Button -->
              <button
                class="remove-button bg-gray-600 hover:bg-gray-400 rounded p-1 font-medium w-1/2"
              >
                Like
              </button>

              <!-- Details Button -->
              <button
                class="remove-button bg-cyan-600 hover:bg-cyan-500 rounded p-1 font-medium w-1/2"
              >
                View..
              </button>
            </div>
          </div>
        </div>

        <div class="card bg-gray-900 rounded-2xl shadow-lg p-6 w-full ">
          <!-- Product Image -->
          <img
            src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg"
            alt="Colosseso.jpg"
            class="rounded-xl w-full h-52 object-cover text-white"
          />

          <!-- Product Info -->
          <div class="mt-4">
            <h2 class=" subheading text-xl font-semibold text-gray-200">
              The Alps
            </h2>

            <p class=" description text-gray-300 text-sm mt-1">
              The mountains go on forever and the view is breathtaking.
            </p>           

            <!-- Quantity + Remove -->
            <div class="flex items-center gap-6  mt-5">
              <!-- Like Button -->
              <button
                class="remove-button bg-gray-600 hover:bg-gray-400 rounded p-1 font-medium w-1/2"
              >
                Like
              </button>

              <!-- Details Button -->
              <button
                class="remove-button bg-cyan-600 hover:bg-cyan-500 rounded p-1 font-medium w-1/2"
              >
                View..
              </button>
            </div>
          </div>
        </div>
        <div class="card bg-gray-900 rounded-2xl shadow-lg p-6 w-full ">
          <!-- Product Image -->
          <img
            src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg"
            alt="Colosseso.jpg"
            class="rounded-xl w-full h-52 object-cover text-white"
          />

          <!-- Product Info -->
          <div class="mt-4">
            <h2 class=" subheading text-xl font-semibold text-gray-200">
              Seascape
            </h2>

            <p class=" description text-gray-300 text-sm mt-1">
              The water was still, the air was cool and the feeling is pure peace.
            </p>           

            <!-- Quantity + Remove -->
            <div class="flex items-center gap-6  mt-5">
              <!-- Like Button -->
              <button
                class="remove-button bg-gray-600 hover:bg-gray-400 rounded p-1 font-medium w-1/2"
              >
                Like
              </button>

              <!-- Details Button -->
              <button
                class="remove-button bg-cyan-600 hover:bg-cyan-500 rounded p-1 font-medium w-1/2"
              >
                View..
              </button>
            </div>
          </div>
        </div>
        
        </div>
        <div class=" font-['Dancing_Script'] text-[1.4rem] text-right w-full pr-12 text-orange-200 ">
        Developed by
        <br /> KGM💖
        </div>
      </div>
      
      </div>

      
    </div>
  </body>
</html>
